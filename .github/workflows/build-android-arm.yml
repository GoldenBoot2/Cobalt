name: Build Cobalt (Android arm)

# Manual run only: Actions tab > "Build Cobalt (Android arm)" > Run workflow.
# Builds the official Cobalt source with Cobalt's own Docker setup
# (docker-compose.yml service "android-arm", docker/linux/android/Dockerfile).

on:
  workflow_dispatch:
    inputs:
      cobalt_ref:
        description: "youtube/cobalt tag or branch"
        required: true
        default: "25.lts.40"
      config:
        description: "Build type"
        required: true
        default: "gold"
        type: choice
        options: [gold, qa]
      goldenboot:
        description: "Apply GoldenBoot patches (AdGuard filter lists, lower memory limits)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      # No disk clean-up step: a build (with the compiler cache) uses about 40 GB of the
      # runner's ~85 GB free, and the clean-up took 2-3 minutes.
      - name: Check out Cobalt source
        uses: actions/checkout@v7
        with:
          repository: youtube/cobalt
          ref: ${{ inputs.cobalt_ref }}
          fetch-depth: 1
          path: cobalt

      - name: Check out GoldenBoot patches
        if: ${{ inputs.goldenboot }}
        uses: actions/checkout@v7
        with:
          path: gb
          fetch-depth: 1

      - name: Apply GoldenBoot patches
        if: ${{ inputs.goldenboot }}
        # AdGuard Base (2), Tracking Protection (3) and Mobile Ads (11) lists, downloaded now,
        # plus AdGuard Scriptlets (corelibs build) and ExtendedCss from npm (pinned, checked).
        run: |
          mkdir -p /tmp/adg && cd /tmp/adg
          curl -fsSL -o sl.tgz https://registry.npmjs.org/@adguard/scriptlets/-/scriptlets-2.5.1.tgz
          curl -fsSL -o ec.tgz https://registry.npmjs.org/@adguard/extended-css/-/extended-css-2.3.0.tgz
          printf '%s\n' \
            '347c98bb6557e982ab2a4427a620446727b850dd286e1f98b7b27d7afd0ba12f  sl.tgz' \
            'af78bc7d5f501b76487c9ed9e35e5a8b8234414bf31d3dc213e666a9a7956d9d  ec.tgz' | sha256sum -c
          mkdir sl ec && tar -xzf sl.tgz -C sl && tar -xzf ec.tgz -C ec
          cd "$GITHUB_WORKSPACE"
          python3 gb/patches/adguard_rules.py cobalt/cobalt/network/adguard_rules.inc \
            --scriptlets /tmp/adg/sl/package/dist/scriptlets.corelibs.json \
            --extcss /tmp/adg/ec/package/dist/extended-css.min.js 2 3 11
          python3 gb/patches/apply.py cobalt
          cd cobalt && git status --short && git diff --stat

      - name: Build the Docker build images
        working-directory: cobalt
        # One at a time: each image is built FROM the previous one, and a combined
        # "compose build" builds them in parallel and looks for them on Docker Hub.
        # The base image normally starts FROM marketplace.gcr.io/google/debian11, which
        # refuses anonymous pulls (403); Docker Hub's official debian:bullseye is the
        # same Debian 11, so the base image is built from it directly.
        # Debian 11 has reached end of life: its packages now live on archive.debian.org
        # (deb.debian.org returns 404), so apt is pointed there first.
        run: |
          printf '%s\n' \
            'FROM debian:bullseye' \
            'RUN rm -f /etc/apt/sources.list.d/* \' \
            ' && printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian bullseye-updates main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list \' \
            ' && echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive' \
            > /tmp/Dockerfile.bullseye-archive
          cat /tmp/Dockerfile.bullseye-archive
          docker build -t bullseye-archive:latest -f /tmp/Dockerfile.bullseye-archive /tmp
          docker build --build-arg BASE_OS=bullseye-archive --build-arg BASE_OS_TAG=latest \
            -t cobalt-base -f docker/linux/base/Dockerfile docker/linux
          docker compose build build-base
          docker compose build build-android
          docker image ls
          df -h /

      # Compiler cache: Cobalt's build uses sccache when SCCACHE=1 and SCCACHE_DIR are set.
      # The cache folder is mounted into the container as /root/ccache (docker-compose.yml
      # CCACHE_DIR) and kept between runs with the Actions cache, so unchanged files are not
      # compiled again. The first run fills it; later runs only compile what changed.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: sccache-android-arm-${{ inputs.config }}-${{ github.run_id }}
          restore-keys: sccache-android-arm-${{ inputs.config }}-

      # PYTHONHASHSEED=0: Cobalt's binding generator iterates a Python set, so without a fixed
      # seed v8c_gen_type_conversion.h comes out in a different order every build and ~185
      # binding files miss the compiler cache (~9 min). GRADLE_USER_HOME inside the cache
      # folder keeps Gradle and its Maven downloads between builds (also avoids HTTP 429).
      - name: Build Cobalt
        working-directory: cobalt
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
        run: |
          mkdir -p "$CCACHE_DIR/sccache"
          du -sh "$CCACHE_DIR" || true
          docker compose run --rm -T \
            -e CONFIG=${{ inputs.config }} \
            -e NINJA_PARALLEL=4 \
            -e TARGET=cobalt_install \
            -e SCCACHE=1 \
            -e SCCACHE_DIR=/root/ccache/sccache \
            -e SCCACHE_CACHE_SIZE=6G \
            -e PYTHONHASHSEED=0 \
            -e SCCACHE_LOG=debug \
            -e SCCACHE_ERROR_LOG=/root/ccache/sccache-server.log \
            -e GRADLE_USER_HOME=/root/ccache/gradle \
            android-arm
          sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR"
          du -sh "$CCACHE_DIR"
          df -h /

      # The container writes the cache as root; the cache action runs as the runner user.
      # A cancelled or early-failed run has an empty or tiny cache; saving it would make it the
      # newest one, and the next run would restore it and compile from scratch (~70 min).
      - name: Make the compiler cache readable
        id: ccache_size
        if: always()
        run: |
          mkdir -p ccache
          sudo chown -R "$(id -u):$(id -g)" ccache
          # The sccache server log is for this run only: keep it out of the saved cache.
          if [ -f ccache/sccache-server.log ]; then mv ccache/sccache-server.log sccache-server.log; fi
          # Gradle's own daemon/lock files must not be cached.
          rm -rf ccache/gradle/daemon ccache/gradle/caches/*/*.lock ccache/gradle/native || true
          du -sh ccache ccache/* || true
          echo "mb=$(du -sm ccache | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Save the compiler cache
        if: always() && steps.ccache_size.outputs.mb >= 50
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: sccache-android-arm-${{ inputs.config }}-${{ github.run_id }}

      # Build-speed check: the generated V8 binding files miss the compiler cache in every
      # build. Record every input of a few of them (checksums) and their compile commands,
      # so two runs can be compared to find what changes between builds.
      - name: Fingerprint generated binding inputs
        if: success()
        continue-on-error: true
        run: |
          pip install --quiet --break-system-packages ninja || pip install --quiet ninja
          fp="$GITHUB_WORKSPACE/fp"; mkdir -p "$fp"
          cd cobalt/out/android-arm_${{ inputs.config }}
          for o in obj/cobalt/browser/generated_bindings_sources/v8c_storage_event.o \
                   obj/cobalt/browser/generated_bindings_sources/v8c_abort_signal.o \
                   obj/cobalt/browser/generated_types_sources/v8c_algorithm.o \
                   obj/cobalt/browser/generated_types_sources/v8c_aes_ctr_params.o; do
            n=$(basename "$o" .o)
            ninja -t deps "$o" | tail -n +2 | awk 'NF{print $1}' | sort | while read -r f; do
              sha256sum "$f"; done > "$fp/$n.deps.txt"
            ninja -t commands "$o" | tail -n 1 > "$fp/$n.cmd.txt"
            wc -l "$fp/$n.deps.txt"
          done
          # The generated header every binding file includes; it must be identical between builds.
          cp gen/bindings/browser/source/v8c_gen_type_conversion.h "$fp/" || true
          sha256sum gen/bindings/browser/source/v8c_gen_type_conversion.h || true
          # What sccache did with each compile (hit / miss / not cacheable and why).
          log="$GITHUB_WORKSPACE/sccache-server.log"
          if [ -f "$log" ]; then
            ls -la "$log"
            grep -ciE "cache hit" "$log" | sed 's/^/hit lines: /'
            grep -ciE "cache miss" "$log" | sed 's/^/miss lines: /'
            grep -ciE "non-cacheable|not cacheable|cannot cache" "$log" | sed 's/^/non-cacheable lines: /'
            grep -iE "generated_(bindings|types)_sources" "$log" | head -n 600 > "$fp/sccache-bindings.txt" || true
            grep -iE "non-cacheable|not cacheable|cannot cache|error" "$log" | head -n 300 > "$fp/sccache-noncacheable.txt" || true
            grep -iE "v8c_algorithm|v8c_storage_event" "$log" | head -n 200 > "$fp/sccache-samples.txt" || true
            tail -n 200 "$log" > "$fp/sccache-tail.txt"
          else
            echo "no sccache server log"
          fi

      - name: Upload the fingerprints
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: fingerprints-${{ github.run_id }}
          path: fp/
          retention-days: 7

      - name: Collect the APK
        run: |
          mkdir -p dist
          find cobalt/out -name "*.apk" -size +1M -print
          apk=$(find cobalt/out -name "cobalt.apk" | head -n 1)
          test -n "$apk"
          cp "$apk" "dist/cobalt-${{ inputs.cobalt_ref }}-android-arm-${{ inputs.config }}${{ inputs.goldenboot && '-gb' || '' }}.apk"
          sha256sum dist/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: cobalt-${{ inputs.cobalt_ref }}-android-arm-${{ inputs.config }}${{ inputs.goldenboot && '-gb' || '' }}
          path: dist/*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
