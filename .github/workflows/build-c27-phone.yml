name: Build Cobalt 27 gold (Android phone, arm64)

# PHONE build of Cobalt 27 ("Chrobalt", Chromium based) as a size-optimised release (gold =
# is_official_build), to replace Google's CI devel APK (libchrobalt.so 137 MB) that the phone app
# is repacked from (CobaltPhone/tools/phone27_pack.py, local). Same steps as youtube/cobalt's own
# CI (.github/workflows/main.yaml + .github/actions/{depot_tools,build}), without Docker:
# gclient sync with target_os android, cobalt/build/gn.py -p android-arm64 -C gold, autoninja.
#
# A full Chromium build does not fit in one 6 h job on a free 4-CPU runner. The build stops
# itself in time, saves its compiler cache (sccache) and is simply started again: each run
# gets the already compiled files from the cache and goes further, until the APK is built.
# (Until 2026-11-16 every save failed - sccache was still writing - so each run started from zero.)
# Manual run only: Actions tab > this workflow > Run workflow.

on:
  workflow_dispatch:
    inputs:
      cobalt_ref:
        description: "youtube/cobalt commit, tag or branch (default: the 27.lts commit of the current phone APK)"
        required: true
        default: "de12c750ec0ee767d986f5c3aee7c2b1aa743795"
      config:
        description: "Build type"
        required: true
        default: "gold"
        type: choice
        options: [gold, qa, devel]
      build_minutes:
        description: "Minutes of compiling in this run (the rest of the 6 h is for setup and saving the cache)"
        required: true
        default: "250"
      devtools:
        description: "TEST builds only: keep the DevTools server in gold (adb forward localabstract:content_shell_devtools_remote)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  actions: read

env:
  DEPOT_TOOLS_UPDATE: 0
  DEPOT_TOOLS_REPORT_BUILD: 0
  DEPOT_TOOLS_COLLECT_METRICS: 0
  DEPOT_TOOLS_METRICS: 0
  PYTHONHASHSEED: 0
  OUT: out/android-arm64_${{ inputs.config }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        # Chromium source + Android deps + build need far more than the ~85 GB a runner has free.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm || true
          sudo docker image prune -af || true
          df -h /

      - name: Check out Cobalt 27 source
        run: |
          mkdir -p cobalt/src && cd cobalt/src
          git init -q
          git remote add origin https://github.com/youtube/cobalt.git
          git fetch -q --depth 1 origin "${{ inputs.cobalt_ref }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %cd %s'
          du -sh . ; df -h /

      # Phone app: before a page has drawn, the compositor clears to YouTube's dark background instead of
      # transparent. On Android 14+ Cobalt draws into the window's own opaque surface, where transparent shows
      # as one black frame at the splash -> page switch. SetOverlayVideoMode() still sets it transparent when
      # video overlays are on, so overlay video is not covered.
      - name: Phone patches
        working-directory: cobalt/src
        run: |
          f=cobalt/shell/android/content_view_render_view.cc
          sed -i 's|^    compositor_->SetBackgroundColor(SK_ColorTRANSPARENT);$|    compositor_->SetBackgroundColor(SkColorSetRGB(0x0F, 0x0F, 0x0F));|' "$f"
          test "$(grep -c 'SkColorSetRGB(0x0F, 0x0F, 0x0F)' "$f")" = 1
          # Browser name on the network: Cobalt sends "Chrome/27.lts ... Starboard/18" (27 = Cobalt's version; the
          # engine is Chromium 138), which sites read as a 2013 Chrome: YouTube Music answers "Your browser is
          # deprecated". The phone app announces the real engine as mobile Chrome 138. (A plain early return would
          # break the build: -Wunreachable-code.)
          f=cobalt/browser/cobalt_content_browser_client.cc
          sed -i 's|^  static const std::string user_agent_str = platform_info.ToString();$|  static const std::string user_agent_str = (static_cast<void>(platform_info), std::string("Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Mobile Safari/537.36"));|' "$f"
          test "$(grep -c 'Chrome/138.0.0.0 Mobile Safari' "$f")" = 1
          # Diagnostic log lines (YouTube Music playback: its player request never reaches the GPU media service)
          python3 - <<'GBDIAG'
          # Diagnostic log lines for YouTube Music playback (2026-11-15): every hop of a Starboard player request.
          def patch(f, a, b):
              t = open(f, encoding='utf-8').read()
              assert t.count(a) == 1, (f, a)
              open(f, 'w', encoding='utf-8').write(t.replace(a, b))
          patch('media/mojo/clients/mojo_renderer_factory.cc', '  interface_factory_->CreateStarboardRenderer(',
                '  LOG(ERROR) << "GBDIAG renderer-side CreateStarboardRenderer factory=" << interface_factory_;\n  interface_factory_->CreateStarboardRenderer(')
          patch('content/browser/media/media_interface_proxy.cc', '    factory->CreateStarboardRenderer(',
                '    LOG(ERROR) << "GBDIAG browser proxy " << this << " forwards CreateStarboardRenderer";\n    factory->CreateStarboardRenderer(')
          patch('media/mojo/services/interface_factory_impl.cc', '  auto renderer = mojo_media_client_->CreateStarboardRenderer(',
                '  LOG(ERROR) << "GBDIAG gpu InterfaceFactoryImpl " << this << " CreateStarboardRenderer";\n  auto renderer = mojo_media_client_->CreateStarboardRenderer(')
          patch('media/mojo/services/interface_factory_impl.cc', '    DLOG(ERROR) << "StarboardRenderer creation failed.";',
                '    LOG(ERROR) << "GBDIAG StarboardRenderer creation failed.";')
          # Round 2 (2026-11-17): Music's request reaches the renderer factory but never the browser proxy.
          # Renderer-side MediaInterfaceFactory: which instance, thread hop, pipe binding, pipe loss, destruction.
          r = 'content/renderer/media/media_interface_factory.cc'
          patch(r, '  task_runner_ = base::SingleThreadTaskRunner::GetCurrentDefault();\n  weak_this_ = weak_factory_.GetWeakPtr();\n}',
                '  task_runner_ = base::SingleThreadTaskRunner::GetCurrentDefault();\n  weak_this_ = weak_factory_.GetWeakPtr();\n  LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " created (frame broker)";\n}')
          patch(r, '  // have `media_interface_factory_`.\n  weak_this_ = weak_factory_.GetWeakPtr();\n}',
                '  // have `media_interface_factory_`.\n  weak_this_ = weak_factory_.GetWeakPtr();\n  LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " created (given remote)";\n}')
          patch(r, 'MediaInterfaceFactory::~MediaInterfaceFactory() {\n',
                'MediaInterfaceFactory::~MediaInterfaceFactory() {\n  LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " destroyed";\n')
          patch(r, '          client_extension_remote) {\n  if (!task_runner_->BelongsToCurrentThread()) {',
                '          client_extension_remote) {\n  LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " CreateStarboardRenderer on_own_thread=" << task_runner_->BelongsToCurrentThread();\n  if (!task_runner_->BelongsToCurrentThread()) {')
          patch(r, '  GetMediaInterfaceFactory()->CreateStarboardRenderer(',
                '  LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " sends to browser, bound=" << media_interface_factory_.is_bound() << " connected=" << (media_interface_factory_.is_bound() && media_interface_factory_.is_connected());\n  GetMediaInterfaceFactory()->CreateStarboardRenderer(')
          patch(r, '  if (!media_interface_factory_) {\n',
                '  if (!media_interface_factory_) {\n    LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " binds a new InterfaceFactory pipe, has_broker=" << (interface_broker_ != nullptr);\n')
          patch(r, '  media_interface_factory_.reset();\n',
                '  LOG(ERROR) << "GBDIAG renderer MediaInterfaceFactory " << this << " pipe DISCONNECTED";\n  media_interface_factory_.reset();\n')
          # Browser side: each InterfaceFactory binding (with the frame's URL) and every CreateStarboardRenderer call.
          b = 'content/browser/media/media_interface_proxy.cc'
          patch(b, '  receivers_.Add(this, std::move(receiver));',
                '  LOG(ERROR) << "GBDIAG browser proxy " << this << " Bind for " << render_frame_host().GetLastCommittedURL().spec();\n  receivers_.Add(this, std::move(receiver));')
          patch(b, '  if (factory) {\n    LOG(ERROR) << "GBDIAG browser proxy "',
                '  LOG(ERROR) << "GBDIAG browser proxy " << this << " got CreateStarboardRenderer, factory=" << factory;\n  if (factory) {\n    LOG(ERROR) << "GBDIAG browser proxy "')
          # Which navigation Cobalt's release-build CSP check cancels (seen on Music right before its player requests).
          patch('cobalt/browser/cobalt_secure_navigation_throttle.cc',
                '  LOG(WARNING) << "Navigation throttle canceling navigation due to "\n                  "missing CSP headers";',
                '  LOG(ERROR) << "GBDIAG CSP throttle cancels " << navigation_handle()->GetURL().spec() << " main_frame=" << navigation_handle()->IsInMainFrame();')
          # Round 3 (2026-11-17, 2.0.86 result): on Music the renderer binds a new InterfaceFactory pipe through
          # the frame's BrowserInterfaceBroker, the browser never logs Bind, and the pipe drops 2-17 ms later.
          # Log the broker's dispatch, prerender/preview policy, binder lookup, and broker (re)binding/resets.
          h = 'content/browser/browser_interface_broker_impl.h'
          patch(h, '#include "base/memory/raw_ptr.h"\n', '#include "base/logging.h"\n#include "base/memory/raw_ptr.h"\n')
          patch(h, '    DCHECK(receiver.interface_name().has_value());\n    if (!policy_applier_) {',
                '    DCHECK(receiver.interface_name().has_value());\n    if (receiver.interface_name()->find("media.mojom.InterfaceFactory") != std::string::npos)\n      LOG(ERROR) << "GBDIAG broker " << this << " GetInterface " << *receiver.interface_name() << " policy_applier=" << (policy_applier_ != nullptr);\n    if (!policy_applier_) {')
          patch(h, '  void BindInterface(mojo::GenericPendingReceiver receiver) {\n',
                '  void BindInterface(mojo::GenericPendingReceiver receiver) {\n    if (receiver.interface_name() && receiver.interface_name()->find("media.mojom.InterfaceFactory") != std::string::npos)\n      LOG(ERROR) << "GBDIAG broker " << this << " BindInterface (policy passed) " << *receiver.interface_name();\n')
          f = 'content/browser/renderer_host/render_frame_host_impl.cc'
          patch(f, '  broker_receiver_.Bind(std::move(receiver));\n  broker_receiver_.SetFilter(',
                '  LOG(ERROR) << "GBDIAG rfh " << this << " broker bound, url=" << GetLastCommittedURL().spec() << " prerendering=" << frame_tree()->is_prerendering() << " preview=" << (mojo_binder_policy_applier_ != nullptr);\n  broker_receiver_.Bind(std::move(receiver));\n  broker_receiver_.SetFilter(')
          patch(f, 'void RenderFrameHostImpl::ReportNoBinderForInterface(const std::string& error) {\n',
                'void RenderFrameHostImpl::ReportNoBinderForInterface(const std::string& error) {\n  LOG(ERROR) << "GBDIAG rfh " << this << " NO BINDER: " << error << " url=" << GetLastCommittedURL().spec();\n')
          # FIX (round-3 result, 2026-11-17): YouTube Music asks for payments.mojom.DigitalGoodsFactory (Play
          # billing), which Cobalt does not provide. Chromium then calls ReportBadMessage on the frame's interface
          # broker, which CLOSES the page's whole BrowserInterfaceBroker pipe: every later interface request of
          # that page (media.mojom.InterfaceFactory = the video player) is dropped and Music never plays. Only log
          # it and keep the broker open; the asked-for interface pipe alone is dropped, as for any missing binder.
          patch(f, '  broker_receiver_.ReportBadMessage(error + " for the frame/document scope");\n',
                '  // GoldenBoot phone: keep the broker open (YouTube Music asks for DigitalGoodsFactory).\n')
          patch(f, '    if (broker_receiver_.is_bound()) {\n      broker_receiver_.reset();\n    }\n',
                '    if (broker_receiver_.is_bound()) {\n      LOG(ERROR) << "GBDIAG rfh " << this << " broker reset for a new document";\n      broker_receiver_.reset();\n    }\n')
          patch(f, '    if (!frame_tree_node_->is_on_initial_empty_document()) {\n      broker_receiver_.reset();\n',
                '    if (!frame_tree_node_->is_on_initial_empty_document()) {\n      LOG(ERROR) << "GBDIAG rfh " << this << " broker reset: renderer sent no new broker (bad message)";\n      broker_receiver_.reset();\n')
          print('GBDIAG patches applied')
          GBDIAG
          # Black video after lock / unlock (user 2026-11-17/18, YT Music+): at screen off the app moves the running
          # video decoder to a placeholder surface (GbVideo.java, MediaCodec.setOutputSurface) and at screen on back to
          # the new surface. Cobalt's TV rule then released that decoder when the new surface arrived (any decoder still
          # holding a surface counts as stale: OnSurfaceDestroyed -> TeardownCodec), and it is only rebuilt after a
          # seek: measured "Calling MediaCodec.release()" right after onVideoSurfaceCreated, then "Trying to write input
          # buffer when media_decoder_ is null" while the song played on. A NEW surface arriving while a decoder still
          # holds one only happens in that app flow (Cobalt itself always reports the loss first, which releases it),
          # so the decoder is kept and only the global surface is replaced. If the app could not move it, the app
          # reports the loss first (GbVideo returns false) and the old release path runs as before.
          python3 - <<'GBVIDEO'
          f = 'starboard/android/shared/video_window.cc'
          t = open(f, encoding='utf-8').read()
          a = ('  if (g_video_surface_holder) {\n'
               '    g_video_surface_holder->OnSurfaceDestroyed();\n'
               '    g_video_surface_holder = NULL;\n'
               '  }\n')
          b = ('  if (g_video_surface_holder && surface) {\n'
               '    // GoldenBoot phone: the app already moved this decoder to the new surface; keep it.\n'
               '    SB_LOG(INFO) << "GB video decoder kept on the new surface";\n'
               '  } else if (g_video_surface_holder) {\n'
               '    g_video_surface_holder->OnSurfaceDestroyed();\n'
               '    g_video_surface_holder = NULL;\n'
               '  }\n')
          assert t.count(a) == 1, 'video_window.cc holder block'
          open(f, 'w', encoding='utf-8').write(t.replace(a, b))
          print('GBVIDEO patch applied')
          GBVIDEO
          # Frozen video after the screen was off (measured 2026-11-18): Chromium's WebMediaPlayerImpl disables the video
          # track of an audio+video playback 10 s after the page is hidden (DisableVideoTrackIfNeeded); the chunk demuxer
          # then returns end of stream for video ("Video EOS enqueued" / "Video ended" in Starboard) and on page show
          # EnableVideoTrackIfNeeded asks the renderer to switch it back on, but StarboardRenderer::OnTracksChanged is
          # "not supported" (a no-op), so no video is read again: picture frozen, audio on. The renderer cannot do track
          # changes, so the frame must say the optimization is unsupported (the option exists for such renderers).
          python3 - <<'GBTRACKS'
          f = 'cobalt/renderer/cobalt_content_renderer_client.cc'
          t = open(f, encoding='utf-8').read()
          a = '#include "content/public/renderer/render_frame.h"\n'
          b = a + '#include "content/public/renderer/render_frame_media_playback_options.h"\n'
          assert t.count(a) == 1, 'renderer client include'
          t = t.replace(a, b)
          a = '  new CobaltRenderFrameObserver(render_frame);\n'
          b = (a + '  {\n'
                   '    // GoldenBoot phone: StarboardRenderer cannot switch tracks back on (OnTracksChanged is a no-op),\n'
                   '    // so a video track disabled while the page was hidden stayed off: frozen video after unlock.\n'
                   '    content::RenderFrameMediaPlaybackOptions gb_options =\n'
                   '        render_frame->GetRenderFrameMediaPlaybackOptions();\n'
                   '    gb_options.is_background_video_track_optimization_supported = false;\n'
                   '    render_frame->SetRenderFrameMediaPlaybackOptions(gb_options);\n'
                   '  }\n')
          assert t.count(a) == 1, 'RenderFrameCreated observer line'
          open(f, 'w', encoding='utf-8').write(t.replace(a, b))
          print('GBTRACKS patch applied')
          GBTRACKS
          # App scripts at document start, loaded from the APK (user 2026-11-18: "without recompiling them again and
          # again ... a one lifetime patch and allow all the scripts"). Cobalt runs its own polyfills before any page
          # script (Shell::RegisterInjectedJavaScript -> js_injection AddDocumentStartJavaScript, every origin). Here it
          # also runs assets/gb_docstart.js from the app's own APK (stored uncompressed: base::android::OpenApkAsset),
          # which the app pack builds from CobaltPhone/assets/docstart/*.js. Changing those scripts needs only a repack,
          # never an engine build. First user: gb_host.js (sound on link/fresh loads, Shorts start with overlay; it must
          # run before YouTube's first inline scripts). The scripts check the page host themselves.
          python3 - <<'GBDOCSTART'
          f = 'cobalt/shell/browser/shell.cc'
          t = open(f, encoding='utf-8').read()
          a = '#include "base/command_line.h"\n'
          b = ('#include "base/command_line.h"\n'
               '#include "base/files/file.h"\n'
               '#include "base/files/memory_mapped_file.h"\n'
               '#include "build/build_config.h"\n'
               '#if BUILDFLAG(IS_ANDROID)\n'
               '#include "base/android/apk_assets.h"\n'
               '#endif\n')
          assert t.count(a) == 1, 'shell.cc include'
          t = t.replace(a, b)
          a = '\n}\n\nvoid Shell::LoadSplashScreenWebContents() {'
          b = ('\n'
               '#if BUILDFLAG(IS_ANDROID)\n'
               '  // GoldenBoot phone: the app\'s own document-start scripts (assets/gb_docstart.js, uncompressed in the APK).\n'
               '  {\n'
               '    base::MemoryMappedFile::Region region;\n'
               '    int fd = base::android::OpenApkAsset("assets/gb_docstart.js", &region);\n'
               '    if (fd >= 0) {\n'
               '      base::MemoryMappedFile mapped;\n'
               '      if (mapped.Initialize(base::File(fd), region)) {\n'
               '        std::string js(reinterpret_cast<const char*>(mapped.data()), mapped.length());\n'
               '        auto gb_result = js_communication_host_->AddDocumentStartJavaScript(\n'
               '            base::UTF8ToUTF16(js), std::vector<std::string>({"*"}));\n'
               '        LOG(INFO) << "GB document-start scripts: " << js.size() << " bytes"\n'
               '                  << (gb_result.error_message.has_value() ? " (not registered)" : "");\n'
               '      } else {\n'
               '        LOG(ERROR) << "GB document-start scripts: cannot map assets/gb_docstart.js";\n'
               '      }\n'
               '    } else {\n'
               '      LOG(INFO) << "GB document-start scripts: none in the APK";\n'
               '    }\n'
               '  }\n'
               '#endif  // BUILDFLAG(IS_ANDROID)\n'
               '}\n\nvoid Shell::LoadSplashScreenWebContents() {')
          assert t.count(a) == 1, 'RegisterInjectedJavaScript end'
          t = t.replace(a, b)
          open(f, 'w', encoding='utf-8').write(t)
          print('GBDOCSTART patch applied')
          GBDOCSTART
          # No 30 s page-load timeout (TV behaviour): CobaltWebContentsObserver raised the TV "Can't connect" error while
          # a page was still loading on a slow network (kNavigationTimeoutSeconds = 30). Phone browsers keep loading and
          # rely on the network stack's own timeouts; real load failures still raise the error (shown by the app as its
          # phone screen, dl/GbOffline.java).
          python3 - <<'GBNOTIMEOUT'
          f = 'cobalt/browser/cobalt_web_contents_observer.cc'
          t = open(f, encoding='utf-8').read()
          a = ('  base::UmaHistogramBoolean("Cobalt.Network.NavigationTimeout", true);\n'
               '  RaisePlatformError(navigation_id, url);\n')
          b = ('  base::UmaHistogramBoolean("Cobalt.Network.NavigationTimeout", true);\n'
               '  // GoldenBoot phone: a slow load keeps loading (no TV connection dialog after 30 s).\n'
               '  LOG(INFO) << "GB navigation still loading after 30 s: " << navigation_id << " " << url;\n')
          assert t.count(a) == 1, 'OnNavigationTimeout body'
          open(f, 'w', encoding='utf-8').write(t.replace(a, b))
          print('GBNOTIMEOUT patch applied')
          GBNOTIMEOUT
          # TEST builds (input devtools=true, 2026-11-17): gold leaves out the DevTools server (features.gni:
          # enable_devtools_backend is false for "Cobalt + release" -> a stub delegate; the browser client also returns
          # no DevTools manager in release). Keeping it lets the page be inspected over adb like the old devel build
          # (socket content_shell_devtools_remote; Android lets only adb/shell or the app itself connect).
          if [ "${{ inputs.devtools }}" = "true" ]; then
          python3 - <<'GBDEVTOOLS'
          def patch(f, a, b):
              t = open(f, encoding='utf-8').read()
              assert t.count(a) == 1, (f, a)
              open(f, 'w', encoding='utf-8').write(t.replace(a, b))
          patch('content/browser/devtools/features.gni',
                'enable_devtools_backend =\n    enable_devtools_frontend || !(is_cobalt && cobalt_is_release_build)',
                'enable_devtools_backend = true  # GoldenBoot phone TEST build')
          patch('cobalt/browser/cobalt_content_browser_client.cc',
                '#if BUILDFLAG(COBALT_IS_RELEASE_BUILD)\n  return nullptr;\n#else\n  return content::ShellContentBrowserClient::CreateDevToolsManagerDelegate();\n#endif',
                '  return content::ShellContentBrowserClient::CreateDevToolsManagerDelegate();  // GoldenBoot TEST build')
          print('DevTools kept (TEST build)')
          GBDEVTOOLS
          fi

      # Same depot_tools commit as youtube/cobalt's own CI (.github/actions/depot_tools). With
      # DEPOT_TOOLS_UPDATE=0 depot_tools never bootstraps its bundled python3, and the gn wrapper
      # then fails ("python3_bin_reldir.txt not found"), so the bootstrap is run by hand.
      - name: Set up depot_tools
        run: |
          mkdir depot_tools && cd depot_tools
          git init -q
          git remote add origin https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git fetch -q --depth 1 origin 4a978d8f1f3567d5bd729aec018bfc345a14e1cd
          git checkout -q FETCH_HEAD
          source ./bootstrap_python3 && bootstrap_python3
          ls python3_bin_reldir.txt
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"
          ./build_telemetry opt-out || true

      - name: gclient sync (Android deps)
        working-directory: cobalt
        run: |
          gclient config --name=src --unmanaged https://github.com/youtube/cobalt.git
          echo "target_os=['android']" >> .gclient
          echo "target_cpu=['x64', 'arm64']" >> .gclient
          cat .gclient
          gclient sync --no-history --shallow -D --nohooks --jobs 8
          df -h /

      - name: Install build dependencies
        working-directory: cobalt/src
        run: |
          sudo ./build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts || \
            sudo ./build/install-build-deps.sh --android --no-prompt
          df -h /

      - name: gclient runhooks
        working-directory: cobalt
        run: |
          gclient runhooks
          df -h /

      - name: Install sccache
        run: |
          v=0.10.0
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v$v/sccache-v$v-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo install "sccache-v$v-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          sccache --version

      # The compiler cache carries the work from run to run. Only caches of at least 100 MB are
      # saved (a cancelled or early-failed run must never become the newest cache).
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: sccache
          key: sccache-c27-android-arm64-${{ inputs.config }}-${{ github.run_id }}
          restore-keys: sccache-c27-android-arm64-${{ inputs.config }}-

      - name: Generate the build (gn)
        working-directory: cobalt/src
        run: |
          python3 cobalt/build/gn.py -p android-arm64 -C ${{ inputs.config }} --no-rbe --use-sccache
          gn args --list --short --overrides-only "$OUT"

      - name: Build cobalt_apk (stops in time, see build_minutes)
        id: build
        working-directory: cobalt/src
        env:
          SCCACHE_DIR: ${{ github.workspace }}/sccache
          SCCACHE_CACHE_SIZE: 8G
          # Direct mode: a file already in the cache is looked up from its sources and headers without running
          # the preprocessor, so finished steps are skipped in milliseconds instead of being re-processed.
          SCCACHE_DIRECT: "true"
        run: |
          mkdir -p "$SCCACHE_DIR"; du -sh "$SCCACHE_DIR"
          sccache --start-server || true
          left=$(ninja -C "$OUT" -n cobalt/android:cobalt_apk 2>/dev/null | grep -c '^\[' || true)
          echo "steps to do: $left"
          set +e
          timeout --signal=INT "${{ inputs.build_minutes }}m" autoninja -C "$OUT" -j 6 cobalt/android:cobalt_apk 2>&1 | tee ninja.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "ninja exit code $rc"
          # steps left = total - done, from the last "[done/total]" line (ninja -n counted 0 in run 43684497626)
          last=$(grep -oE '\[[0-9]+/[0-9]+\]' ninja.log | tail -1 | tr -d '[]')
          if [ "$rc" = 0 ]; then left=0; elif [ -n "$last" ]; then left=$(( ${last#*/} - ${last%/*} )); else left=unknown; fi
          echo "steps still to do: $left"
          sccache --show-stats || true
          sccache --stop-server || true
          du -sh "$SCCACHE_DIR"; df -h /
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "### Cobalt 27 ${{ inputs.config }}: ninja exit $rc, steps left $left" >> "$GITHUB_STEP_SUMMARY"

      # An sccache server still writing to the cache made the save fail ("tar: sccache: file changed as we
      # read it", run 43728294362) with only a warning, so every run started from an empty cache. The server is
      # stopped and must be gone before the cache is measured and saved.
      - name: Measure the compiler cache
        id: cache_size
        if: always()
        run: |
          sccache --stop-server >/dev/null 2>&1 || true
          for i in $(seq 1 30); do pgrep -x sccache >/dev/null || break; sleep 1; done
          sudo pkill -9 -x sccache || true
          sleep 2
          if pgrep -x sccache; then echo "sccache still running"; exit 1; fi
          sync
          mkdir -p sccache
          echo "mb=$(du -sm sccache | cut -f1)" >> "$GITHUB_OUTPUT"
          du -sh sccache

      - name: Save the compiler cache
        if: always() && steps.cache_size.outputs.mb >= 100
        uses: actions/cache/save@v6
        with:
          path: sccache
          key: sccache-c27-android-arm64-${{ inputs.config }}-${{ github.run_id }}

      # actions/cache/save only warns when saving fails: check that the cache really exists
      - name: Check the cache was saved
        if: always() && steps.cache_size.outputs.mb >= 100
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/caches?key=sccache-c27-android-arm64-${{ inputs.config }}-${{ github.run_id }}" --jq '.total_count')
          echo "caches saved with this run's key: $n"
          echo "### compiler cache saved: $n (${{ steps.cache_size.outputs.mb }} MB)" >> "$GITHUB_STEP_SUMMARY"
          test "$n" -ge 1

      - name: Collect the APK
        if: steps.build.outputs.rc == '0'
        working-directory: cobalt/src
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          find "$OUT" -maxdepth 3 -name '*.apk' -exec ls -la {} \;
          find "$OUT" -maxdepth 3 -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk/" \;
          ls -la "$OUT"/lib.unstripped/libchrobalt.so "$OUT"/libchrobalt.so 2>/dev/null || true

      - name: Upload the APK
        if: steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v7
        with:
          name: cobalt27-android-arm64-${{ inputs.config }}
          path: apk/*.apk
          if-no-files-found: error
